<rect x="428" y="182" width="164" height="52" rx="12" fill="none" class="gblue" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.2053;0.2063;0.2789;0.2799;1.0000" values="0;0;1;1;0;0"/></rect>
<text class="t" x="510.0" y="204" text-anchor="middle">Domain index</text>
<text class="m" x="510.0" y="221" text-anchor="middle">from step 1</text>
<rect class="box" x="645" y="160" width="160" height="96" rx="10"/>
<rect x="643" y="158" width="164" height="100" rx="12" fill="none" class="ggreen" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.3211;0.3221;0.3895;0.3905;1.0000" values="0;0;1;1;0;0"/></rect>
<text class="t" x="725.0" y="182" text-anchor="middle">Prompt</text>
<text class="m" x="725.0" y="201" text-anchor="middle">identity + domain rules</text>
<text class="m" x="725.0" y="216" text-anchor="middle">+ passages + entities</text>
<text class="m" x="725.0" y="231" text-anchor="middle">+ memory + history</text>
<text class="c green" x="725.0" y="245" text-anchor="middle">build_prompt()</text>
<rect class="box" x="840" y="160" width="160" height="96" rx="10"/>
<rect x="838" y="158" width="164" height="100" rx="12" fill="none" class="gorange" stroke-width="2.5" opacity="0"><animate attributeName="opacity" dur="9.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.4053;0.4063;0.6632;0.6642;1.0000" values="0;0;1;1;0;0"/></rect>
<text class="t" x="920.0" y="182" text-anchor="middle">Ollama · mistral</text>
<text class="m" x="920.0" y="201" text-anchor="middle">local LLM on your PC</text>
<text class="m" x="920.0" y="216" text-anchor="middle">localhost:11434</text>
<text class="m" x="920.0" y="231" text-anchor="middle">generates token by token</text>
<text class="c orange" x="920.0" y="245" text-anchor="middle">generate_stream()</text>
<rect class="box" x="600" y="440" width="250" height="56" rx="10"/>
